# Publish a release when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0.
# goreleaser (.goreleaser.yaml) builds the binaries and creates the GitHub release with them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser builds the changelog from the history since the last tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
