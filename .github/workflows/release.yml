# Tags create reviewable unsigned artifacts, never a Release, registry push or repository upload.
name: release-candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check source and test
        run: |
          test -z "$(git status --porcelain)"
          make lint test
      - name: Install checksum-verified build tools (user-local)
        run: python3 scripts/release/tools.py --directory "$RUNNER_TEMP/markov-tools"
      - name: Build unsigned candidate
        env:
          TOOL_DIR: ${{ runner.temp }}/markov-tools
        run: |
          export PATH="$TOOL_DIR:$PATH"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            goreleaser release --clean --skip=publish
          else
            goreleaser release --snapshot --clean --skip=publish
          fi
      - name: Package existing amd64 archive for Arch (no rebuild)
        env:
          CONTAINER_ENGINE: docker
        run: |
          archive=$(find dist -maxdepth 1 -name 'markov_*_linux_amd64.tar.gz' -print -quit)
          version=$(basename "$archive" | sed -E 's/^markov_(.*)_linux_amd64.tar.gz$/\1/; s/-rc\./rc/; s/-dev/dev/')
          python3 scripts/release/arch-package.py "$archive" --version "$version" --output dist
          python3 scripts/release/candidate_manifest.py dist
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Export unsigned OCI candidate (no registry login or push)
        env:
          CONTAINER_ENGINE: docker
          TOOL_DIR: ${{ runner.temp }}/markov-tools
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          python3 scripts/release/oci-candidate.py --version "$version" --output dist/markov.oci.tar
          for arch in amd64 arm64; do
            "$TOOL_DIR/syft" scan oci-archive:dist/markov.oci.tar --platform "linux/$arch" --output "spdx-json=dist/markov.oci.$arch.spdx.json"
          done
          python3 scripts/release/candidate_manifest.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markov-unsigned-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
