name: codify
description: >
  One agentic codification pass over the task workflow (plan 003 phase 1):
  collect the last task run's evidence, let a retro agent make one
  decomposition in a candidate copy, validate it against a recorded fixture,
  and promote it when it passes. Protected: the candidate is rejected if this
  file or anything other than workflows/task.yaml, workflows/task_*.yaml and
  scripts/task/ changes.
  Called by codify_iteration (the in-process loop), which sets the paths
  below; task_run_id selects the task's events from the loop's event log.
steps:
  - name: check_inputs
    type: assert
    that:
      - "codify_dir"
      - "iteration_dir"
      - "task_events"
      - "project_dir"
      - "markov_docs"
    msg: "run the codify_loop workflow (codify.sh), which sets codify_dir, iteration_dir, task_events, project_dir and markov_docs"

  - name: record_fixture
    type: script_exec
    params:
      interpreter: python3
      path: codify/codify.py
      args: [record-fixture, --base-url, "{{ hn_base_url }}", --out, "{{ iteration_dir }}/fixture"]

  - name: collect_evidence
    type: script_exec
    register: evidence_run
    params:
      interpreter: python3
      path: codify/codify.py
      args: [evidence, --events, "{{ task_events }}", --iteration-dir, "{{ iteration_dir }}", --run-id, "{{ task_run_id }}"]

  - name: prepare_candidate
    type: script_exec
    params:
      interpreter: python3
      path: codify/codify.py
      args: [prepare-candidate, --project, "{{ project_dir }}", --out, "{{ codify_dir }}/candidate"]

  - name: retro
    type: claude
    register: retro
    ignore_errors: true
    params:
      chdir: "{{ codify_dir }}/candidate"
      add_dirs: ["{{ iteration_dir }}", "{{ markov_docs }}"]
      allowed_tools: [Read, Grep, Glob, Edit, Write, "Bash({{ markov_bin }} validate:*)"]
      permission_mode: acceptEdits
      limits:
        max_turns: 60
        max_tokens: 1500000
        max_duration: 1200
      prompt: |
        You are the retrospective step of an agentic codification loop for a
        Markov workflow. Markov is a YAML workflow engine; the goal is to move
        work that needs no judgment out of model calls and into explicit
        workflow steps, while keeping the output identical.

        The current directory is a candidate copy of the workflow project.
        Its `task` workflow (workflows/task.yaml) just ran. Evidence of that
        run is in {{ iteration_dir }}/evidence:
        - events.jsonl: Markov's callback events for the run. step_progress
          events carry every agent tool call and result; step_completed
          events carry each step's output.
        - transcripts/: full Claude Code transcripts of the claude steps.
        - metrics.json: agent vs native steps, tokens, cost and time.
        - previous_retro.json and previous_validation.json, when present:
          what the previous pass tried and how its candidate was judged.
          If that candidate failed, read the reasons and do not repeat the
          mistake.

        Codification is gradual. Each pass moves exactly ONE piece of work
        out of the agent:
        1. From the evidence, list the distinct jobs the agent steps did
           (for example: fetch a list, fetch each item, choose fields,
           format, write the file) and decide which need no judgment.
        2. Pick the single earliest such job in the data flow and implement
           it with native Markov steps. Hand its results to the remaining
           claude step through template expressions in the prompt (or a
           file in out_dir that the prompt names), and narrow that prompt
           so the agent no longer does the extracted job.
        3. Leave every other job with the agent, even if it is also
           mechanical; later passes will take it.
        4. Remove the last claude step only in a pass whose one job is that
           step's whole remaining work, and only if that work needs no
           judgment.

        Prefer native steps (http_request, for_each, set_fact, write_file,
        assert, sub-workflows) over scripts. Use a script under
        scripts/task/ with script_exec only for something the step types
        and templates cannot reasonably express, and say why in retro.json;
        a candidate that adds a script without that reason is rejected.

        Rules:
        - Edit only workflows/task.yaml, new or existing helper workflows
          named workflows/task_<name>.yaml (one workflow per file, whose
          name: is task_<name>), and files under scripts/task/. Everything
          else is compared byte for byte and the candidate is rejected if it
          differs.
        - Keep the output contract exactly: the file hn-top10.md in the
          directory named by the out_dir variable, exactly 10 lines in
          topstories.json order, each "- [<title>](<url>)", title verbatim,
          url = the item's url or https://news.ycombinator.com/item?id=<id>
          when it has none, nothing else in the file.
        - Keep reading the API through the hn_base_url variable and writing
          under out_dir: the candidate is tested against a recorded copy of
          the API served at a different hn_base_url, and its output is
          compared line by line with the expected file.
        - Markov's reference docs are in {{ markov_docs }}; read
          step-types.md, for-each.md (especially "register with
          for_each"), template-engine.md, variables-and-context.md and
          workflow-file.md before writing steps.
        - Check the candidate with: {{ markov_bin }} validate .
          Do not run the workflow.
        - If nothing is left to codify (no claude steps remain, or what
          remains needs judgment), change nothing.

        Finally write {{ iteration_dir }}/retro.json containing a JSON object
        with keys:
        - "changed": true or false
        - "jobs": the jobs you listed in step 1, each an object with "job"
          and "where" ("agent" or "native" after this pass)
        - "extracted": the one job this pass moved out of the agent, or null
        - "summary": one or two sentences on what you changed and why
        - "script_justification": why a script was needed, or null when you
          added none
        - "remaining_agent_steps": the number of claude steps left in the
          task workflows

  - name: validate_candidate
    type: script_exec
    register: validation_run
    params:
      interpreter: python3
      path: codify/codify.py
      args:
        - validate
        - --project
        - "{{ project_dir }}"
        - --candidate
        - "{{ codify_dir }}/candidate"
        - --fixture
        - "{{ iteration_dir }}/fixture"
        - --work
        - "{{ iteration_dir }}/validation"
        - --markov
        - "{{ markov_bin }}"
        - --retro
        - "{{ iteration_dir }}/retro.json"

  - name: validation_result
    type: set_fact
    vars:
      validation: "{{ validation_run.stdout | fromjson }}"

  - name: promote
    type: script_exec
    when: "validation.status == 'passed'"
    params:
      interpreter: python3
      path: codify/codify.py
      args:
        - promote
        - --project
        - "{{ project_dir }}"
        - --candidate
        - "{{ codify_dir }}/candidate"
        - --versions
        - "{{ codify_dir }}/versions"
        - --iteration-dir
        - "{{ iteration_dir }}"

  - name: record_metrics
    type: script_exec
    params:
      interpreter: python3
      path: codify/codify.py
      args:
        - record
        - --iteration-dir
        - "{{ iteration_dir }}"
        - --metrics-file
        - "{{ codify_dir }}/metrics.jsonl"
        - --retro-cost
        - "{{ retro.total_cost_usd }}"
        - --retro-tokens
        - "{{ retro.tokens }}"
        - --retro-failed
        - "{{ retro.failed }}"

  - name: report
    type: script_exec
    params:
      interpreter: python3
      content: |
        import json, sys
        v = json.load(sys.stdin)
        print("validation:", v["status"], "; ".join(v["reasons"]))
      stdin: "{{ validation }}"
